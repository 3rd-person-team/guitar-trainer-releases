<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Guitar Trainer의 macOS 공개 배포를 준비하고 있습니다." />
    <title>Guitar Trainer · 배포 준비 중</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: #192a26;
        background: #f3f5ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: 100%;
        max-width: 620px;
        padding: clamp(28px, 7vw, 56px);
        background: #fff;
        border: 1px solid #dce3d7;
        border-radius: 24px;
      }

      .status {
        display: inline-block;
        padding: 7px 12px;
        margin: 0 0 24px;
        border-radius: 999px;
        background: #edf3e7;
        color: #385132;
        font-size: 14px;
        font-weight: 600;
      }

      h1 {
        margin: 0 0 22px;
        font-size: clamp(32px, 7vw, 44px);
        line-height: 1.15;
        letter-spacing: -0.035em;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 22px;
        line-height: 1.5;
        word-break: keep-all;
      }

      p {
        margin: 0;
        color: #52615a;
        line-height: 1.75;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      a {
        display: inline-block;
        margin-top: 28px;
        color: #285338;
        font-weight: 600;
        text-underline-offset: 4px;
      }

      a:focus-visible {
        outline: 3px solid #537e45;
        outline-offset: 6px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">macOS · 배포 준비 중</p>
      <h1>Guitar Trainer</h1>
      <h2>첫 공개 배포를 준비하고 있습니다.</h2>
      <p>
        현재는 내려받을 수 있는 설치 파일이 없습니다. macOS 버전의 서명·공증과 설치 확인을 마친 뒤
        이곳에서 다운로드를 안내하겠습니다.
      </p>
      <a href="https://github.com/3rd-person-team/guitar-trainer-releases/releases">
        GitHub에서 배포 소식 보기
      </a>
    </main>
  </body>
</html>
